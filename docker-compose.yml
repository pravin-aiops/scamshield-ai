services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI_ENABLED: "true"
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_TIMEOUT: "45"
    expose:
      - "8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 60m
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    # Skip the download when the model is already in the volume, retry when the
    # network is flaky, and never block the app: without the model ScamShield
    # still works and shows rule-based summaries.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama list | grep -q "qwen2.5:0.5b"; then
          echo "model already present"
          exit 0
        fi
        for i in 1 2 3 4 5; do
          ollama pull qwen2.5:0.5b && exit 0
          echo "pull failed (attempt $$i), retrying"
          sleep 8
        done
        echo "model not pulled; the app will use rule-based summaries"
        exit 0
    restart: "no"

volumes:
  ollama_data: