
name: ScamShield CI-CD to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scamshield-production-deploy
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest backend/tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-southeast-2
          application-name: scamshield-ai
          environment-name: Scamshield-ai-env
          s3-bucket-name: scamshield-ai-deploy-482439369112
          version-label: scamshield-${{ github.sha }}
          exclude-patterns: node_modules,.git,.github,dist,.venv,venv,__pycache__,.pytest_cache,*.log,.env,.env.*,*.bak
          use-existing-application-version-if-available: true
          wait-for-deployment: true
          wait-for-environment-recovery: true
          deployment-timeout: 900
